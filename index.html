<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitaVault V5.0</title>
    <style>
        :root {
            --primary: #CC7722; --bg: #F9F8F6; --card: #ffffff;
            --text-main: #3C3C3C; --text-sub: #8C8C8C; --accent-soft: #EAE7E2;
            --danger: #BC4A3C; --safe: #6B8E23; --ts-color: #5D5D5D;
        }
        * { box-sizing: border-box; font-family: -apple-system, "Noto Sans TC", sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        
        .header { background: #fff; padding: 20px; border-bottom: 1px solid var(--accent-soft); text-align: center; }
        .header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 3px; color: var(--primary); font-weight: 300; }
        
        .nav-tabs { display: flex; background: white; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--accent-soft); }
        .tab-btn { flex: 1; padding: 12px 5px; text-align: center; font-size: 0.75rem; color: var(--text-sub); cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }
        
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--accent-soft); }
        .section-title { font-size: 0.8rem; font-weight: bold; margin-bottom: 12px; color: var(--primary); border-left: 3px solid var(--primary); padding-left: 8px; }
        
        .input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-end; }
        label { display: block; font-size: 0.65rem; margin-bottom: 3px; color: var(--text-sub); font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--accent-soft); font-size: 14px; background: #fafafa; }
        
        .btn { border-radius: 8px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; padding: 14px; width: 100%; }
        .btn-sub { background: white; border: 1px solid var(--accent-soft); color: var(--text-sub); padding: 10px; }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--accent-soft); }
        .item-meta { font-size: 0.7rem; color: var(--text-sub); }
        .status-pill { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; margin-left: 8px; }
        .s-open { background: var(--primary); color: white; }
        .s-stock { background: var(--accent-soft); color: var(--text-sub); }

        #modalOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:12px; width:92%; max-width:450px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .modal-actions { display: grid; grid-template-columns: 1.5fr 1fr; gap: 10px; margin-top: 20px; }
        .delete-link { display: block; text-align: center; margin-top: 20px; font-size: 0.7rem; color: var(--danger); text-decoration: underline; cursor: pointer; opacity: 0.7; }
        
        .ts-display { font-family: monospace; font-size: 0.75rem; color: var(--ts-color); background: #f0f0f0; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid var(--primary); line-height: 1.4; }
    </style>
</head>
<body>

<div class="header"><h1>VITAVAULT V5.0</h1></div>

<nav class="nav-tabs">
    <div class="tab-btn active" onclick="switchTab('home')">今日</div>
    <div class="tab-btn" onclick="switchTab('stock')">庫存</div>
    <div class="tab-btn" onclick="switchTab('plan')">採買</div>
    <div class="tab-btn" onclick="switchTab('data')">數據</div>
</nav>

<div class="container">
    <div id="tab-home">
        <div class="card" style="border: 1.5px solid var(--primary); background: #FFFDFB;">
            <div class="section-title">智能開啟導航</div>
            <div id="disp-result"></div>
        </div>

        <div class="card">
            <div class="section-title">快速入庫</div>
            <div class="input-row">
                <div style="flex:7"><label>模式</label>
                    <select id="mainCat">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="體態控制">體態控制</option>
                    </select>
                </div>
                <div style="flex:3"><label style="text-align:right">包數</label><input type="number" id="packCount" value="1" style="text-align:right"></div>
            </div>
            <div class="input-row">
                <div style="flex:4"><label>分類</label><input type="text" id="subCat" placeholder="如：眼睛"></div>
                <div style="flex:6"><label>品名</label><input type="text" id="name" placeholder="品項名稱"></div>
            </div>
            <div class="input-row">
                <div style="flex:1"><label>單包總數</label><input type="number" id="totalQty" value="60"></div>
                <div style="flex:1"><label>每次顆數</label><input type="number" id="baseDose" value="1"></div>
                <div style="flex:1"><label>每日次數</label><input type="number" id="baseFreq" value="1"></div>
            </div>
            <div class="input-row">
                <div style="flex:1"><label>到期日期</label><input type="text" class="date-input" id="expiry" placeholder="YYYY/MM/DD"></div>
                <div style="flex:1"><label>購買日期</label><input type="text" class="date-input" id="buyDate" placeholder="YYYY/MM/DD"></div>
            </div>
            <button class="btn btn-main" onclick="batchAdd()">REGISTER</button>
        </div>
        <div id="ongoing-list"></div>
    </div>

    <div id="tab-stock" style="display:none;">
        <div class="card">
            <div class="section-title">全庫存細節 (<span id="itemCount">0</span> 筆)</div>
            <div id="full-inventory" style="max-height:60vh; overflow-y:auto;"></div>
        </div>
    </div>

    <div id="tab-plan" style="display:none;">
        <div class="card"><div class="section-title">補貨雷達</div><div id="plan-analysis">正在分析中...</div></div>
    </div>

    <div id="tab-data" style="display:none;">
        <div class="card">
            <div class="section-title">備份與還原</div>
            <div class="ts-display" id="lastSavedTs">尚未偵測到檔案</div>
            <textarea id="dataBox" rows="8" placeholder="在此貼上數據或點擊導出" style="font-size:11px; margin-bottom:12px;"></textarea>
            <div class="modal-actions">
                <button class="btn btn-main" onclick="exportAndCopy()">導出並自動複製</button>
                <button class="btn btn-sub" onclick="importData()">還原數據</button>
            </div>
        </div>
        <div class="card">
            <div class="section-title">歷史紀錄 (已吃完)</div>
            <div id="finished-list" style="max-height:200px; overflow-y:auto;"></div>
            <button class="btn" style="color:var(--danger); width:100%; margin-top:10px; font-size:0.75rem; border:1px solid #eee;" onclick="cleanFinished()">清空歷史紀錄</button>
        </div>
    </div>
</div>

<div id="modalOverlay"><div class="modal-content" id="modalUI"></div></div>

<script>
    let db = JSON.parse(localStorage.getItem('vitaVault_db') || '[]');
    let lastTs = localStorage.getItem('vitaVault_ts') || '無紀錄';

    // 強化日期格式化邏輯
    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('date-input')) {
            let val = e.target.value.replace(/\D/g, '').substring(0, 8);
            let fmt = "";
            if (val.length > 0) {
                if (val.length <= 4) fmt = val;
                else if (val.length <= 6) fmt = val.substring(0, 4) + '/' + val.substring(4);
                else fmt = val.substring(0, 4) + '/' + val.substring(4, 6) + '/' + val.substring(6);
            }
            e.target.value = fmt;
        }
    });

    function save() {
        const now = new Date().toLocaleString();
        localStorage.setItem('vitaVault_db', JSON.stringify(db));
        localStorage.setItem('vitaVault_ts', now);
        lastTs = now;
        renderAll();
    }

    function batchAdd() {
        const name = document.getElementById('name').value;
        const exp = document.getElementById('expiry').value;
        if(!name || exp.length < 10) return alert("請填寫品名與完整日期格式(YYYY/MM/DD)");
        
        const count = parseInt(document.getElementById('packCount').value) || 1;
        const now = new Date().toLocaleString();
        for(let i=0; i<count; i++) {
            db.push({
                id: Date.now() + i,
                mainCat: document.getElementById('mainCat').value,
                subCat: document.getElementById('subCat').value || '未分類',
                name: name,
                totalQty: parseInt(document.getElementById('totalQty').value) || 0,
                dose: parseInt(document.getElementById('baseDose').value) || 1,
                freq: parseInt(document.getElementById('baseFreq').value) || 1,
                expiry: exp,
                buyDate: document.getElementById('buyDate').value || now.split(' ')[0],
                status: '庫存',
                updatedAt: now
            });
        }
        save();
        document.getElementById('name').value = ''; 
        alert("已成功寫入 " + count + " 筆資料");
    }

    function renderAll() {
        // 今日頁面：服用中
        const list = document.getElementById('ongoing-list');
        list.innerHTML = '<div class="item-meta" style="margin:15px 0 10px;">服用中項目</div>';
        db.filter(i => i.status === '服用中').forEach(item => {
            const daily = item.mainCat === '生理期' ? (item.dose * item.freq * 7 / 30) : (item.dose * item.freq);
            const daysLeft = Math.round(item.totalQty / (daily || 1));
            list.innerHTML += `<div class="card" onclick="openEdit(${item.id})">
                <div style="display:flex; justify-content:space-between"><b>${item.name}</b><span class="status-pill s-open">OPEN</span></div>
                <div class="item-meta">${item.subCat} | 餘 ${daysLeft} 天 | 效期: ${item.expiry}</div>
            </div>`;
        });

        // 庫存頁面
        const invList = document.getElementById('full-inventory');
        invList.innerHTML = '';
        db.filter(i => i.status !== '已吃完').sort((a,b) => new Date(a.expiry) - new Date(b.expiry)).forEach(item => {
            invList.innerHTML += `<div class="item-row" onclick="openEdit(${item.id})">
                <div><b>${item.name}</b><span class="status-pill ${item.status==='服用中'?'s-open':'s-stock'}">${item.status}</span><div class="item-meta">${item.subCat} | 餘 ${item.totalQty} | ${item.expiry}</div></div>
            </div>`;
        });

        // 數據頁面：歷史紀錄
        const finList = document.getElementById('finished-list');
        if(finList) {
            const finished = db.filter(i => i.status === '已吃完');
            finList.innerHTML = finished.length ? finished.map(i => `<div class="item-row" style="opacity:0.6;"><div><s>${i.name}</s><div class="item-meta">完成於: ${i.updatedAt}</div></div></div>`).join('') : '<div class="item-meta" style="text-align:center; padding:10px;">尚無紀錄</div>';
        }

        // 智能建議（簡化版）
        const disp = document.getElementById('disp-result');
        const rec = db.filter(i => i.status === '庫存').sort((a,b) => new Date(a.expiry) - new Date(b.expiry))[0];
        disp.innerHTML = rec ? `<div style="margin-bottom:8px"><b>最優先推薦開啟：${rec.name}</b></div><div class="item-meta">分類: ${rec.subCat} | 效期: ${rec.expiry}</div><button class="btn btn-main" style="margin-top:10px; padding:8px;" onclick="openEdit(${rec.id})">點此開啟/盤點</button>` : '<div class="item-meta">目前無庫存待開</div>';

        document.getElementById('itemCount').innerText = db.filter(i => i.status !== '已吃完').length;
        document.getElementById('lastSavedTs').innerText = "本地檔案最後存取時間：\n" + lastTs;
    }

    function openEdit(id) {
        const item = db.find(i => i.id === id);
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('modalUI').innerHTML = `
            <div style="font-size:0.65rem; color:var(--text-sub); margin-bottom:12px;">資料戳記: ${item.updatedAt}</div>
            <label>品項名稱</label><input type="text" id="upName" value="${item.name}">
            <label>狀態</label><select id="upStatus">
                <option value="庫存" ${item.status==='庫存'?'selected':''}>庫存 (未開)</option>
                <option value="服用中" ${item.status==='服用中'?'selected':''}>服用中 (已開)</option>
                <option value="已吃完" ${item.status==='已吃完'?'selected':''}>已吃完 (歸檔)</option>
            </select>
            <div class="input-row">
                <div style="flex:1"><label>目前剩餘數量</label><input type="number" id="upQty" value="${item.totalQty}"></div>
                <div style="flex:1"><label>效期</label><input type="text" class="date-input" id="upExp" value="${item.expiry}"></div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-main" onclick="updateItem(${id})">儲存盤點</button>
                <button class="btn btn-sub" onclick="closeModal()">取消</button>
            </div>
            <span class="delete-link" onclick="deleteItem(${id})">永久刪除此項紀錄</span>`;
    }

    function updateItem(id) {
        const i = db.find(x => x.id === id);
        i.name = document.getElementById('upName').value;
        i.status = document.getElementById('upStatus').value;
        i.totalQty = parseInt(document.getElementById('upQty').value) || 0;
        i.expiry = document.getElementById('upExp').value;
        i.updatedAt = new Date().toLocaleString();
        save(); closeModal();
    }

    function deleteItem(id) {
        if(confirm("確定永久刪除？不可復原。")) {
            db = db.filter(i => i.id !== id);
            save(); closeModal();
        }
    }

    function exportAndCopy() {
        const data = JSON.stringify(db);
        const box = document.getElementById('dataBox');
        box.value = data;
        box.select();
        box.setSelectionRange(0, 99999); // 針對手機優化

        if (navigator.clipboard) {
            navigator.clipboard.writeText(data).then(() => alert("成功複製 " + db.length + " 筆資料，請妥善保存備份碼。"));
        } else {
            alert("請手動複製文字框內的數據。");
        }
    }

    function importData() {
        const raw = document.getElementById('dataBox').value.trim();
        if(!raw) return alert("請先貼入備份代碼");
        try {
            const parsed = JSON.parse(raw);
            if(Array.isArray(parsed)) {
                db = parsed;
                localStorage.setItem('vitaVault_db', JSON.stringify(db));
                localStorage.setItem('vitaVault_ts', new Date().toLocaleString());
                lastTs = localStorage.getItem('vitaVault_ts');
                renderAll();
                alert("導入成功！目前系統中有 " + db.length + " 筆資料。");
                document.getElementById('dataBox').value = '';
            }
        } catch(e) { alert("JSON 解析失敗，請確認代碼是否複製完整。"); }
    }

    function cleanFinished() { if(confirm("確定清空所有歷史紀錄？")) { db = db.filter(i => i.status !== '已吃完'); save(); } }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function switchTab(t) {
        ['home', 'stock', 'plan', 'data'].forEach(x => document.getElementById('tab-'+x).style.display = x===t?'block':'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.onclick.toString().includes(t)));
        renderAll();
    }
    
    // 初始化
    window.onload = () => {
        const d = new Date();
        document.getElementById('buyDate').value = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
        renderAll();
    };
</script>
</body>
</html>
