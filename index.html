<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supplement</title>
    <style>
:root {
    --mj-bg: #f6f5f0;           
    --mj-card-bg: #fdfaf5;      
    --mj-text-main: #333333;    
    --mj-text-sub: #7f7f7f;     
    --mj-border: #d1c7b7;       
    --mj-accent: #7f0019;       
    --mj-radius: 2px;
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; letter-spacing: 0.02em; }

body { 
    background-color: var(--mj-bg); 
    color: var(--mj-text-main); 
    margin: 0; padding: 0;
    font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
}

.container { width: 100%; max-width: 480px; margin: 0 auto; padding: 15px 15px 100px; }

/* --- 分頁導航 --- */
.nav-tabs { display: flex; background: #ffffff; border: 1px solid #e0e0e0; border-radius: var(--mj-radius); padding: 6px; margin: 15px 15px 25px; }
.tab-btn { flex: 1; padding: 12px 5px; text-align: center; font-size: 14px; font-weight: 500; color: #7f7f7f; border: none; background: transparent; cursor: pointer; border-radius: var(--mj-radius); }
.tab-btn.active { background: #ebebeb; color: #333333; }

.section-title { font-size: 14px; font-weight: 700; margin-bottom: 20px; color: #333; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: "■"; font-size: 10px; color: var(--mj-accent); }

/* --- 卡片：手帳感 vs 工裝感 --- */
.card { background: #ffffff; border: 1px solid #e0e0e0; border-radius: 2px; padding: 24px; margin-bottom: 24px; position: relative; }

/* 服用中與雷達：手帳感虛線 */
#ongoing-list .item-row, #plan-analysis, #tab-plan .card:last-child {
    background: var(--mj-card-bg); border: 1px dashed var(--mj-border); box-shadow: 4px 4px 0px rgba(0, 0, 0, 0.05);
}

/* 核心紅框卡片 */
#tab-home .card:first-child, #tab-stock .card:first-child {
    border: 1.5px solid var(--mj-accent) !important; background: #FFFDFB !important; box-shadow: 4px 4px 0px rgba(127, 0, 25, 0.05);
}

/* --- 輸入框邏輯 --- */
label { font-size: 10px; font-weight: 700; color: #999; text-transform: uppercase; margin-bottom: 5px; display: block; }
input, select, textarea { width: 100%; padding: 10px; border-radius: 0; border: 1px solid #ddd; font-size: 14px; background: #fdfdfd; outline: none; }
.input-row { display: flex; gap: 12px; margin-bottom: 15px; align-items: flex-end; }
.col-1 { flex: 1; min-width: 0; }

.select-wrapper { position: relative; width: 100%; height: 38px; }
.select-wrapper input { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background-color: #fff; pointer-events: none; }
.select-wrapper select { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; opacity: 0; cursor: pointer; }
.select-wrapper input:not([readonly]) { z-index: 3; pointer-events: auto; border-color: var(--mj-accent); }

/* --- 列表樣式：找回你喜歡的細節 --- */
.item-row { padding: 16px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.item-header { display: flex; align-items: center; gap: 8px; }
.item-name { font-size: 15px; font-weight: 600; color: #333; }
.item-meta-row { font-size: 12px; color: #999; display: flex; justify-content: space-between; align-items: center; }
.item-sub-label { font-size: 11px; color: #888; background: #f5f5f5; padding: 2px 6px; border: 1px solid #ddd; border-radius: 2px; }

.status-pill { font-size: 11px; padding: 2px 8px; border: 1.5px solid; font-weight: 800; }
.s-服用中 { color: var(--mj-accent); border-color: var(--mj-accent); background: #fff; }
.s-庫存 { color: #999; border-color: #ddd; background: #fff; }

.btn-main { background: var(--mj-accent); color: white; padding: 15px; border: none; font-weight: 700; width: 100%; cursor: pointer; }
.btn-sub { background: #fff; border: 1px solid #333; color: #333; padding: 10px; font-weight: 700; }

#modalOverlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(2px); display:none; justify-content:center; align-items:center; position:fixed; top:0; left:0; width:100%; height:100%; z-index:1000; }
.modal-content { background: #fff; padding: 30px; border-top: 8px solid #333; width: 90%; max-width: 400px; }
    </style>
</head>
<body>

<nav class="nav-tabs">
    <div class="tab-btn active" id="btn-home" onclick="switchTab('home')">今日管理</div>
    <div class="tab-btn" id="btn-stock" onclick="switchTab('stock')">庫存管理</div>
    <div class="tab-btn" id="btn-plan" onclick="switchTab('plan')">採買規劃</div>
    <div class="tab-btn" id="btn-data" onclick="switchTab('data')">數據管理</div>
</nav>

<div class="container">
    <div id="tab-home">
        <div class="card">
            <div class="section-title">智能導航開瓶</div>
            <div class="input-row">
                <div class="col-1"><label>模式</label>
                    <select id="dispMain" onchange="updateDispOptions()">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="補充品">補充品</option>
                    </select>
                </div>
                <div class="col-1"><label>分類</label><select id="dispSub" onchange="renderDispRec()"></select></div>
            </div>
            <div id="disp-result"></div>
        </div>
        <div class="card"><div class="section-title">目前服用中</div><div id="ongoing-list"></div></div>
    </div>

    <div id="tab-stock" style="display:none;">
        <div class="card">
            <div class="section-title">快速入庫備品</div>
            <div class="input-row">
                <div class="col-1"><label>模式</label>
                    <select id="mainCat">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="補充品">補充品</option>
                    </select>
                </div>
                <div class="col-1"><label>包數</label><input type="number" id="packCount" value="1"></div>
            </div>
            <div class="input-row">
                <div class="col-1"><label>分類</label>
                    <div class="select-wrapper">
                        <input type="text" id="subCat" placeholder="選取或輸入" readonly>
                        <select id="subCatPicker" onchange="handleSubCatChange(this, 'subCat')"></select>
                    </div>
                </div>
                <div class="col-1"><label>品名</label><input type="text" id="name" placeholder="請輸入名稱"></div>
            </div>
            <div class="input-row">
                <div class="col-1"><label>單包總數</label><input type="number" id="totalQty" value="60"></div>
                <div class="col-1"><label>日回/回顆</label>
                    <div style="display:flex; gap:5px;">
                        <input type="number" id="baseFreq" value="1">
                        <input type="number" id="baseDose" value="1">
                    </div>
                </div>
            </div>
            <div class="input-row">
                <div class="col-1"><label>到期日期</label><input type="text" class="date-input" id="expiry" placeholder="YYYY/MM/DD"></div>
                <div class="col-1"><label>購買日期</label><input type="text" class="date-input" id="buyDate" placeholder="YYYY/MM/DD"></div>
            </div>
            <button class="btn-main" onclick="batchAdd()">批次登記入庫</button>
        </div>
        <div class="card"><div class="section-title">所有備品庫存</div><div id="full-inventory"></div></div>
    </div>

    <div id="tab-plan" style="display:none;">
        <div class="card">
            <div class="section-title">日期斷貨預估</div>
            <div class="input-row">
                <div class="col-1"><input type="text" class="date-input" id="checkDate" placeholder="YYYY/MM/DD"></div>
                <div class="col-1"><button class="btn-sub" style="width:100%" onclick="renderAnalysis(true)">分析</button></div>
            </div>
            <div id="deadline-result"></div>
        </div>
        <div class="card"><div class="section-title">90 天補貨雷達</div><div id="plan-analysis"></div></div>
    </div>

    <div id="tab-data" style="display:none;">
        <div class="card">
            <div class="section-title">數據備份 <span id="lastUpdateText" style="font-size:10px; color:#BBB; margin-left:auto;"></span></div>
            <textarea id="dataBox" rows="6" style="font-size:12px; margin-bottom:15px;"></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <button class="btn-main" onclick="exportAndCopy()">導出複製</button>
                <button class="btn-sub" onclick="importData()">導入數據</button>
            </div>
        </div>
        <div class="card"><div class="section-title">完食歷史紀錄</div><div id="finished-list"></div></div>
    </div>
</div>

<div id="modalOverlay"><div class="modal-content" id="modalUI"></div></div>

<script>
    let db = JSON.parse(localStorage.getItem('vitaVault_db') || '[]');

    function save() {
        localStorage.setItem('vitaVault_db', JSON.stringify(db));
        localStorage.setItem('vitaVault_lastUpdate', new Date().toLocaleString());
        renderAll();
    }

    // 計算剩餘天數核心邏輯
    function simulateInventory(itemList) {
        if (!itemList.length) return 0;
        let item = itemList[0];
        const rate = (parseFloat(item.freq) || 1) * (parseFloat(item.dose) || 1);
        if (rate <= 0) return 999;
        return Math.floor(item.totalQty / rate);
    }

    function createItemElement(item) {
        const days = simulateInventory([item]);
        const finishDate = new Date(); finishDate.setDate(finishDate.getDate() + days);
        const expDate = new Date(item.expiry);
        const diffExp = Math.ceil((expDate - new Date()) / 86400000);
        
        let color = days < 7 ? 'var(--mj-accent)' : (days < 14 ? '#E69B35' : '#666');
        let dateStr = `${finishDate.getMonth()+1}/${finishDate.getDate()}`;

        return `
            <div class="item-row" onclick="openEdit(${item.id})">
                <div class="item-header">
                    <span class="status-pill s-${item.status}">${item.status}</span>
                    <span class="item-sub-label">${item.subCat}</span>
                    <span class="item-name">${item.name}</span>
                </div>
                <div class="item-meta-row">
                    <span>${item.totalQty}顆 ▪︎ 預計 <b style="color:${color}">${dateStr}</b> 吃完</span>
                    <span style="color:${diffExp < 60 ? 'red' : '#999'}">🗓️ EXP:${item.expiry}</span>
                </div>
            </div>`;
    }

    function handleSubCatChange(pickerEl, inputId) {
        const input = document.getElementById(inputId);
        const val = pickerEl.value;
        if (val === 'CUSTOM') {
            input.value = ''; input.readOnly = false; input.focus();
        } else if (val !== "") {
            input.value = val; input.readOnly = true;
        }
    }

    function updateSubCatDatalist() {
        let allSubs = [...new Set(db.map(i => i.subCat))].filter(s => s && s !== '未分類');
        allSubs.sort(new Intl.Collator('zh-Hant-TW').compare);
        const opt = '<option value="">🔻選取</option>' + allSubs.map(s => `<option value="${s}">${s}</option>`).join('') + '<option value="CUSTOM">📝手動輸入</option>';
        if(document.getElementById('subCatPicker')) document.getElementById('subCatPicker').innerHTML = opt;
        return opt;
    }

    function batchAdd() {
        const name = document.getElementById('name').value, exp = document.getElementById('expiry').value;
        if(!name || exp.length < 10) return alert("資訊不完整");
        const count = parseInt(document.getElementById('packCount').value) || 1;
        for(let n=0; n<count; n++) {
            db.push({ 
                id: Date.now() + n, mainCat: document.getElementById('mainCat').value, 
                subCat: document.getElementById('subCat').value || '未分類', 
                name: name, totalQty: parseInt(document.getElementById('totalQty').value),
                expiry: exp, buyDate: document.getElementById('buyDate').value,
                freq: document.getElementById('baseFreq').value, dose: document.getElementById('baseDose').value,
                status: '庫存', updatedAt: new Date().toLocaleString() 
            });
        }
        save(); alert("入庫成功"); document.getElementById('name').value = '';
    }

    function openEdit(id) {
        const i = db.find(x => x.id === id);
        const options = updateSubCatDatalist();
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('modalUI').innerHTML = `
            <div class="section-title">編輯項目</div>
            <div class="input-row">
                <div class="col-1"><label>模式</label><select id="upMain">
                    <option value="基礎營養" ${i.mainCat==='基礎營養'?'selected':''}>基礎營養</option>
                    <option value="生理期" ${i.mainCat==='生理期'?'selected':''}>生理期</option>
                    <option value="補充品" ${i.mainCat==='補充品'?'selected':''}>補充品</option>
                </select></div>
                <div class="col-1"><label>分類</label>
                    <div class="select-wrapper">
                        <input type="text" id="upSub" value="${i.subCat}" readonly>
                        <select onchange="handleSubCatChange(this, 'upSub')">${options}</select>
                    </div>
                </div>
            </div>
            <div class="input-row"><div class="col-1"><label>品名</label><input type="text" id="upName" value="${i.name}"></div></div>
            <div class="input-row">
                <div class="col-1"><label>狀態</label><select id="upStatus">
                    <option value="庫存" ${i.status==='庫存'?'selected':''}>庫存</option>
                    <option value="服用中" ${i.status==='服用中'?'selected':''}>服用中</option>
                    <option value="已吃完" ${i.status==='已吃完'?'selected':''}>已吃完</option>
                </select></div>
                <div class="col-1"><label>剩餘顆數</label><input type="number" id="upQty" value="${i.totalQty}"></div>
            </div>
            <div class="input-row">
                <div class="col-1"><label>日回</label><input type="number" id="upFreq" value="${i.freq}"></div>
                <div class="col-1"><label>回顆</label><input type="number" id="upDose" value="${i.dose}"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;">
                <button class="btn-main" onclick="updateItem(${id})">儲存</button>
                <button class="btn-sub" onclick="closeModal()">取消</button>
            </div>
            <div style="text-align:center; color:red; margin-top:25px; font-size:12px; cursor:pointer;" onclick="deleteItem(${id})">⚠️ 刪除資料</div>
        `;
    }

    function updateItem(id) {
        const i = db.find(x => x.id === id);
        i.mainCat = document.getElementById('upMain').value; i.subCat = document.getElementById('upSub').value;
        i.name = document.getElementById('upName').value; i.status = document.getElementById('upStatus').value;
        i.totalQty = parseInt(document.getElementById('upQty').value); i.freq = document.getElementById('upFreq').value; i.dose = document.getElementById('upDose').value;
        save(); closeModal();
    }

    function renderAll() {
        const ongoing = db.filter(i => i.status === '服用中').map(i => createItemElement(i)).join('');
        document.getElementById('ongoing-list').innerHTML = ongoing || '<div style="color:#CCC;text-align:center;padding:20px;">無服用項目</div>';
        
        const stock = db.filter(i => i.status === '庫存').map(i => createItemElement(i)).join('');
        document.getElementById('full-inventory').innerHTML = stock || '<div style="color:#CCC;text-align:center;padding:20px;">無庫存</div>';
        
        document.getElementById('finished-list').innerHTML = db.filter(i => i.status === '已吃完').map(i => `<div class="item-row" style="opacity:0.6"><div class="item-header"><span class="item-name">${i.name}</span></div></div>`).join('');
        updateSubCatDatalist(); updateDispOptions();
    }

    function updateDispOptions() {
        const mode = document.getElementById('dispMain').value;
        const subs = [...new Set(db.filter(i => i.mainCat === mode && i.status === '庫存').map(i => i.subCat))];
        document.getElementById('dispSub').innerHTML = subs.length ? subs.map(s => `<option value="${s}">${s}</option>`).join('') : '<option value="">無</option>';
        renderDispRec();
    }

    function renderDispRec() {
        const mode = document.getElementById('dispMain').value, sub = document.getElementById('dispSub').value, res = document.getElementById('disp-result');
        const item = db.filter(i => i.mainCat === mode && i.subCat === sub && i.status === '庫存').sort((a,b) => new Date(a.expiry)-new Date(b.expiry))[0];
        if(item) res.innerHTML = `<div style="margin-top:15px; border:1px dashed var(--mj-accent); padding:15px; background:#fff;">${createItemElement(item)}<button class="btn-main" style="margin-top:10px" onclick="quickOpen(${item.id})">確認開啟</button></div>`;
        else res.innerHTML = '<div style="padding:20px; color:#BBB; text-align:center;">無庫存</div>';
    }

    function quickOpen(id) { const i = db.find(x => x.id === id); i.status = '服用中'; save(); }
    function deleteItem(id) { if(confirm("確定刪除？")) { db = db.filter(x => x.id !== id); save(); closeModal(); } }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function switchTab(t) {
        ['home', 'stock', 'plan', 'data'].forEach(x => document.getElementById('tab-'+x).style.display = x===t?'block':'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+t).classList.add('active');
        renderAll();
    }
    function exportAndCopy() { const box = document.getElementById('dataBox'); box.value = JSON.stringify(db); box.select(); navigator.clipboard.writeText(box.value).then(() => alert("已複製")); }
    function importData() { try { db = JSON.parse(document.getElementById('dataBox').value); save(); alert("導入成功"); } catch(e) { alert("格式錯誤"); } }

    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('date-input')) {
            let val = e.target.value.replace(/\D/g, '').substring(0, 8);
            if (val.length > 4 && val.length <= 6) val = val.substring(0, 4) + '/' + val.substring(4);
            else if (val.length > 6) val = val.substring(0, 4) + '/' + val.substring(4, 6) + '/' + val.substring(6);
            e.target.value = val;
        }
    });

    window.onload = renderAll;
</script>
</body>
</html>
