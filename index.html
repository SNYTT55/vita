<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitaVault V5.8.7</title>
    <style>
        :root {
            --primary: #CC7722; --bg: #F9F8F6; --card: #ffffff;
            --text-main: #424242; --text-label: #757575; --border-color: #E0E0E0;
        }
        * { box-sizing: border-box; font-family: -apple-system, "Noto Sans TC", sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; }
        
        .header { background: #fff; padding: 20px; border-bottom: 1px solid #EEE; text-align: center; }
        .header h1 { margin: 0; font-size: 1rem; letter-spacing: 4px; color: var(--primary); font-weight: 300; text-transform: uppercase; }
        
        .nav-tabs { display: flex; background: white; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #EEE; }
        .tab-btn { flex: 1; padding: 14px 5px; text-align: center; font-size: 0.8rem; color: #999; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }

        .container { max-width: 600px; margin: auto; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 22px; margin-bottom: 15px; border: 1px solid #EEE; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        
        .section-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 22px; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 12px; line-height: 1; }

        /* 佈局比例控制 */
        .input-row { display: flex; gap: 12px; margin-bottom: 16px; width: 100%; }
        .w-75 { flex: 3; } 
        .w-25 { flex: 1; } 
        .w-50 { flex: 1; } 
        .w-33 { flex: 1; } 

        label { display: block; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-label); font-weight: 500; }
        
        /* 回歸 V5.8.5 的質感大小與舒適度 */
        input, select { 
            width: 100%; 
            padding: 15px 16px; /* 增加高度 */
            border-radius: 12px; /* 舒適的大圓角 */
            border: 1.5px solid var(--border-color); 
            font-size: 1rem; 
            background: #FDFDFD; 
            color: var(--text-main);
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }
        input:focus { outline: none; border-color: var(--primary); background: #FFF; box-shadow: 0 0 0 3px rgba(204, 119, 34, 0.05); }
        input::placeholder { color: #BDBDBD; font-size: 0.95rem; }

        .btn-main { background: var(--primary); color: white; padding: 18px; width: 100%; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .btn-main:active { opacity: 0.8; transform: scale(0.98); }

        /* 列表樣式 */
        .item-row { padding: 16px 0; border-bottom: 1px solid #F5F5F5; cursor: pointer; }
        .item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .item-sub-label { font-size: 0.7rem; font-weight: bold; color: var(--primary); background: #FFF5EB; padding: 2px 8px; border-radius: 4px; }
        .item-name { font-weight: 600; font-size: 1rem; }
        .item-meta-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #888; }
        
        #modalOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; backdrop-filter: blur(3px); }
        .modal-content { background:white; padding:25px; border-radius:20px; width:92%; max-width:450px; }
        .status-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; color:white; }
        .s-服用中 { background: var(--primary); }
        .s-庫存 { background: #BBB; }
    </style>
</head>
<body>

<div class="header"><h1>VITAVAULT V5.8.7</h1></div>

<nav class="nav-tabs">
    <div class="tab-btn active" id="btn-home" onclick="switchTab('home')">今日服用</div>
    <div class="tab-btn" id="btn-stock" onclick="switchTab('stock')">庫存管理</div>
    <div class="tab-btn" id="btn-data" onclick="switchTab('data')">數據備份</div>
</nav>

<div class="container">
    <div id="tab-stock">
        <div class="card">
            <div class="section-title">快速入庫備品</div>
            
            <div class="input-row">
                <div class="w-75">
                    <label>模式</label>
                    <select id="mainCat">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="體態控制">體態控制</option>
                    </select>
                </div>
                <div class="w-25">
                    <label>包數</label>
                    <input type="number" id="packCount" value="1">
                </div>
            </div>

            <div class="input-row">
                <div class="w-50">
                    <label>分類</label>
                    <input type="text" id="subCat" placeholder="如：鐵劑">
                </div>
                <div class="w-50">
                    <label>品名</label>
                    <input type="text" id="name" placeholder="品項名稱">
                </div>
            </div>

            <div class="input-row">
                <div class="w-33">
                    <label>單包總數</label>
                    <input type="number" id="totalQty" value="60">
                </div>
                <div class="w-33">
                    <label>每日回數</label>
                    <input type="number" id="baseFreq" value="1">
                </div>
                <div class="w-33">
                    <label>每回顆數</label>
                    <input type="number" id="baseDose" value="1">
                </div>
            </div>

            <div class="input-row">
                <div class="w-50">
                    <label>到期日期</label>
                    <input type="text" class="date-input" id="expiry" placeholder="YYYY/MM/DD">
                </div>
                <div class="w-50">
                    <label>購買日期</label>
                    <input type="text" class="date-input" id="buyDate" placeholder="YYYY/MM/DD">
                </div>
            </div>

            <button class="btn-main" onclick="batchAdd()">批次登記入庫</button>
        </div>
        
        <div class="card">
            <div class="section-title">備品庫存清單</div>
            <div id="full-inventory"></div>
        </div>
    </div>

    <div id="tab-home" style="display:none;">
        <div class="card">
            <div class="section-title">目前服用中</div>
            <div id="ongoing-list"></div>
        </div>
    </div>

    <div id="tab-data" style="display:none;">
        <div class="card">
            <div class="section-title">數據導出</div>
            <textarea id="dataBox" rows="5" style="width:100%; border-radius:12px; border:1.5px solid #EEE; padding:10px; font-size:12px; background:#FAFAFA;"></textarea>
            <button class="btn-main" onclick="exportAndCopy()">複製所有數據</button>
        </div>
    </div>
</div>

<div id="modalOverlay"><div class="modal-content" id="modalUI"></div></div>

<script>
    let db = JSON.parse(localStorage.getItem('vitaVault_db') || '[]');

    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('date-input')) {
            let val = e.target.value.replace(/\D/g, '').substring(0, 8);
            if (val.length > 4 && val.length <= 6) val = val.substring(0, 4) + '/' + val.substring(4);
            else if (val.length > 6) val = val.substring(0, 4) + '/' + val.substring(4, 6) + '/' + val.substring(6);
            e.target.value = val;
        }
    });

    function save() {
        localStorage.setItem('vitaVault_db', JSON.stringify(db));
        renderAll();
    }

    function batchAdd() {
        const name = document.getElementById('name').value;
        const count = parseInt(document.getElementById('packCount').value) || 1;
        const exp = document.getElementById('expiry').value;
        if(!name || exp.length < 10) return alert("請填寫品名與有效日期");

        for(let n=0; n<count; n++) {
            db.push({
                id: Date.now() + n,
                mainCat: document.getElementById('mainCat').value,
                subCat: document.getElementById('subCat').value || '未分類',
                name: name,
                totalQty: parseInt(document.getElementById('totalQty').value),
                buyDate: document.getElementById('buyDate').value,
                expiry: exp,
                freq: document.getElementById('baseFreq').value,
                dose: document.getElementById('baseDose').value,
                status: '庫存',
                updatedAt: new Date().toLocaleString()
            });
        }
        save();
        alert(`已成功入庫 ${count} 筆！`);
        document.getElementById('name').value = '';
    }

    function renderAll() {
        document.getElementById('ongoing-list').innerHTML = db.filter(i => i.status === '服用中').map(i => `
            <div class="item-row">
                <div class="item-header"><span class="status-pill s-服用中">服用中</span> <span class="item-sub-label">${i.subCat}</span> <span class="item-name">${i.name}</span></div>
                <div class="item-meta-row"><span>剩餘 ${i.totalQty} 顆</span><span>效期: ${i.expiry}</span></div>
            </div>`).join('') || '<div style="color:#CCC; text-align:center;">無服用中項目</div>';

        document.getElementById('full-inventory').innerHTML = db.filter(i => i.status === '庫存').sort((a,b) => new Date(a.expiry) - new Date(b.expiry)).map(i => `
            <div class="item-row">
                <div class="item-header"><span class="status-pill s-庫存">庫存</span> <span class="item-sub-label">${i.subCat}</span> <span class="item-name">${i.name}</span></div>
                <div class="item-meta-row"><span>數量: ${i.totalQty} 顆</span><span>效期: ${i.expiry}</span></div>
            </div>`).join('') || '<div style="color:#CCC; text-align:center;">無備品庫存</div>';
    }

    function switchTab(t) {
        ['home', 'stock', 'data'].forEach(x => document.getElementById('tab-'+x).style.display = x===t?'block':'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+t).classList.add('active');
        renderAll();
    }

    function exportAndCopy() {
        const box = document.getElementById('dataBox');
        box.value = JSON.stringify(db);
        box.select();
        document.execCommand('copy');
        alert("數據已複製");
    }

    window.onload = renderAll;
</script>
</body>
</html>
