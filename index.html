<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitaVault V5.9</title>
    <style>
        :root {
            --primary: #CC7722; --bg: #F9F8F6; --card: #ffffff;
            --text-main: #3C3C3C; --text-sub: #8C8C8C; --accent-soft: #EAE7E2;
            --danger: #BC4A3C; --safe: #6B8E23;
        }
        * { box-sizing: border-box; font-family: -apple-system, "Noto Sans TC", sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; }
        .header { background: #fff; padding: 20px; border-bottom: 1px solid var(--accent-soft); text-align: center; }
        .header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 3px; color: var(--primary); font-weight: 300; }
        .nav-tabs { display: flex; background: white; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--accent-soft); }
        .tab-btn { flex: 1; padding: 12px 5px; text-align: center; font-size: 0.75rem; color: var(--text-sub); cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--accent-soft); }
        .section-title { font-size: 0.8rem; font-weight: bold; margin-bottom: 12px; color: var(--primary); border-left: 3px solid var(--primary); padding-left: 8px; }
        
        .item-row { display: flex; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--accent-soft); cursor: pointer; }
        .item-info { flex: 1; min-width: 0; }
        .item-header { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
        .item-name { font-size: 0.95rem; font-weight: bold; color: var(--text-main); }
        .item-sub-text { font-size: 0.95rem; font-weight: bold; color: var(--primary); }
        .item-meta { font-size: 0.75rem; color: var(--text-sub); display: block; }
        
        .status-pill { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; flex-shrink: 0; }
        .s-服用中 { background: var(--primary); color: white; }
        .s-庫存 { background: var(--accent-soft); color: var(--text-sub); }
        .s-已吃完 { background: #eee; color: #aaa; text-decoration: line-through; }

        .input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-end; }
        label { display: block; font-size: 0.65rem; margin-bottom: 3px; color: var(--text-sub); font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--accent-soft); font-size: 14px; background: #fafafa; }
        .btn { border-radius: 8px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--primary); color: white; padding: 14px; width: 100%; }
        .btn-sub { background: white; border: 1px solid var(--accent-soft); color: var(--text-sub); padding: 10px; }
        
        #modalOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:12px; width:92%; max-width:450px; }
        .timestamp { font-size: 10px; color: var(--text-sub); text-align: left; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="header"><h1>VITAVAULT V5.9</h1></div>

<nav class="nav-tabs">
    <div class="tab-btn active" onclick="switchTab('home')">今日</div>
    <div class="tab-btn" onclick="switchTab('stock')">庫存</div>
    <div class="tab-btn" onclick="switchTab('plan')">採買</div>
    <div class="tab-btn" onclick="switchTab('data')">數據</div>
</nav>

<div class="container">
    <div id="tab-home">
        <div class="card" style="border: 1.5px solid var(--primary); background: #FFFDFB;">
            <div class="section-title">智能開啟導航</div>
            <div class="input-row">
                <div style="flex:1"><label>模式</label>
                    <select id="dispMain" onchange="updateDispOptions()">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="體態控制">體態控制</option>
                    </select>
                </div>
                <div style="flex:1"><label>類別</label><select id="dispSub" onchange="renderDispRec()"></select></div>
            </div>
            <div id="disp-result" style="margin-top:10px;"></div>
        </div>

        <div class="card">
            <div class="section-title">快速入庫</div>
            <div class="input-row">
                <div style="flex:7"><label>模式</label>
                    <select id="mainCat">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="體態控制">體態控制</option>
                    </select>
                </div>
                <div style="flex:3"><label style="text-align:right">包數</label><input type="number" id="packCount" value="1" style="text-align:right"></div>
            </div>
            <div class="input-row">
                <div style="flex:4"><label>分類</label><input type="text" id="subCat" placeholder="如：眼睛"></div>
                <div style="flex:6"><label>品名</label><input type="text" id="name" placeholder="品項名稱"></div>
            </div>
            <div class="input-row">
                <div style="flex:1.5"><label>單包總量</label><input type="number" id="totalQty" value="60"></div>
                <div style="flex:1"><label>頻率</label><select id="baseCycle"><option value="daily">每日</option><option value="weekly">每週</option></select></div>
                <div style="flex:1.2"><label>回數</label><input type="number" id="baseFreq" value="1"></div>
                <div style="flex:1.2"><label>顆數</label><input type="text" id="baseDose" value="1"></div>
            </div>
            <div class="input-row">
                <div style="flex:1"><label>到期日期</label><input type="text" class="date-input" id="expiry" placeholder="YYYY/MM/DD"></div>
                <div style="flex:1"><label>購買日期</label><input type="text" class="date-input" id="buyDate" placeholder="YYYY/MM/DD"></div>
            </div>
            <button class="btn btn-main" onclick="batchAdd()">REGISTER</button>
        </div>
        
        <div class="card">
            <div class="section-title">目前服用中</div>
            <div id="ongoing-list"></div>
        </div>
    </div>

    <div id="tab-stock" style="display:none;">
        <div class="card"><div class="section-title">純庫存清單</div><div id="full-inventory" style="max-height:65vh; overflow-y:auto;"></div></div>
    </div>

    <div id="tab-plan" style="display:none;">
        <div class="card"><div class="section-title">180 天補貨雷達</div><div id="plan-analysis"></div></div>
    </div>

    <div id="tab-data" style="display:none;">
        <div class="card">
            <div class="section-title">數據備份與還原</div>
            <div id="lastUpdateText" class="timestamp">LAST RECORDED: ---</div>
            <textarea id="dataBox" rows="6" style="font-size:11px; margin-bottom:10px; background:#f0f0f0;"></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn btn-main" onclick="exportAndCopy()">導出複製</button>
                <button class="btn btn-sub" onclick="importData()">導入數據</button>
            </div>
        </div>
        <div class="card"><div id="finished-list"></div><button class="btn" style="color:var(--danger); width:100%; margin-top:15px; font-size:0.75rem;" onclick="cleanFinished()">清空歷史紀錄</button></div>
    </div>
</div>

<div id="modalOverlay"><div class="modal-content" id="modalUI"></div></div>

<script>
    let db = JSON.parse(localStorage.getItem('vitaVault_db') || '[]');

    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('date-input')) {
            let val = e.target.value.replace(/\D/g, '').substring(0, 8);
            if (val.length > 4 && val.length <= 6) val = val.substring(0, 4) + '/' + val.substring(4);
            else if (val.length > 6) val = val.substring(0, 4) + '/' + val.substring(4, 6) + '/' + val.substring(6);
            e.target.value = val;
        }
    });

    function parseMaxDose(doseStr) {
        if (typeof doseStr === 'number') return doseStr;
        const nums = doseStr.match(/\d+(\.\d+)?/g);
        if (!nums) return 1;
        return Math.max(...nums.map(Number));
    }

    function save() {
        localStorage.setItem('vitaVault_db', JSON.stringify(db));
        localStorage.setItem('vitaVault_lastUpdate', new Date().toLocaleString());
        renderAll();
    }

    function getDailyRate(item) {
        const dose = parseMaxDose(item.dose);
        const freq = parseInt(item.freq) || 1;
        let rate = item.cycle === 'weekly' ? (dose / 7) : (dose * freq);
        if (item.mainCat === '生理期') rate = rate * (7 / 30);
        return rate || 0.0001;
    }

    function createItemElement(item) {
        const isFinished = item.status === '已吃完';
        const rate = getDailyRate(item);
        const daysLeft = Math.round(item.totalQty / rate);
        
        if (isFinished) {
            return `<div class="item-row" onclick="openEdit(${item.id})"><div class="item-info"><div class="item-header"><span class="status-pill s-已吃完">完食</span><span class="item-name">${item.name}</span></div><span class="item-meta">完成於: ${item.updatedAt}</span></div></div>`;
        }

        const doseInfo = (parseInt(item.freq) > 1 ? `${item.freq}回×` : '') + `${item.dose}顆`;

        return `
            <div class="item-row" onclick="openEdit(${item.id})">
                <div class="item-info">
                    <div class="item-header">
                        <span class="status-pill s-${item.status}">${item.status}</span>
                        <span class="item-name">${item.name}</span>
                        <span class="item-sub-text">${item.subCat}</span>
                    </div>
                    <span class="item-meta">餘 ${item.totalQty} 顆 (約 ${daysLeft} 天) · ${doseInfo} · 效期: ${item.expiry}</span>
                </div>
            </div>`;
    }

    function batchAdd() {
        const name = document.getElementById('name').value;
        const exp = document.getElementById('expiry').value;
        if(!name || exp.length < 10) return alert("資料不完整");
        const count = parseInt(document.getElementById('packCount').value) || 1;
        for(let i=0; i<count; i++) {
            db.push({
                id: Date.now() + i, mainCat: document.getElementById('mainCat').value,
                subCat: document.getElementById('subCat').value || '未分類', name: name,
                totalQty: parseInt(document.getElementById('totalQty').value),
                cycle: document.getElementById('baseCycle').value,
                freq: parseInt(document.getElementById('baseFreq').value) || 1,
                dose: document.getElementById('baseDose').value,
                expiry: exp, status: '庫存', updatedAt: new Date().toLocaleString()
            });
        }
        save(); alert("入庫成功"); document.getElementById('name').value = '';
    }

    function updateDispOptions() {
        const mode = document.getElementById('dispMain').value;
        const subs = [...new Set(db.filter(i => i.mainCat === mode && i.status === '庫存').map(i => i.subCat))];
        const el = document.getElementById('dispSub');
        el.innerHTML = subs.length ? subs.map(s => `<option value="${s}">${s}</option>`).join('') : '<option value="">無</option>';
        renderDispRec();
    }

    function renderDispRec() {
        const mode = document.getElementById('dispMain').value;
        const sub = document.getElementById('dispSub').value;
        const res = document.getElementById('disp-result');
        const item = db.filter(i => i.mainCat === mode && i.subCat === sub && i.status === '庫存').sort((a,b) => new Date(a.expiry) - new Date(b.expiry))[0];
        if(item) {
            res.innerHTML = `
                <div style="border: 1px dashed var(--primary); padding:10px; border-radius:8px; background:#fff;">
                    ${createItemElement(item)}
                    <div class="input-row" style="margin-top:10px; padding:10px; background:#fdfdfd; border-radius:6px; border:1px solid #eee;">
                        <div style="flex:1"><label>頻率</label><select id="tempCycle"><option value="daily" ${item.cycle==='daily'?'selected':''}>每日</option><option value="weekly" ${item.cycle==='weekly'?'selected':''}>每週</option></select></div>
                        <div style="flex:1"><label>回數</label><input type="number" id="tempFreq" value="${item.freq}"></div>
                        <div style="flex:1"><label>顆數</label><input type="text" id="tempDose" value="${item.dose}"></div>
                    </div>
                    <button class="btn btn-main" style="margin-top:5px;" onclick="quickOpen(${item.id})">確認開啟此瓶</button>
                </div>`;
        } else { res.innerHTML = '<div class="item-meta">目前無庫存</div>'; }
    }

    function quickOpen(id) {
        const i = db.find(x => x.id === id);
        i.status = '服用中';
        i.cycle = document.getElementById('tempCycle').value;
        i.freq = parseInt(document.getElementById('tempFreq').value);
        i.dose = document.getElementById('tempDose').value;
        i.updatedAt = new Date().toLocaleString();
        save();
    }

    function renderAnalysis() {
        const subSummary = {};
        db.filter(i => i.status !== '已吃完').forEach(i => {
            const rate = getDailyRate(i);
            if(!subSummary[i.subCat]) subSummary[i.subCat] = { totalQty: 0, dailyRate: rate };
            subSummary[i.subCat].totalQty += i.totalQty;
        });
        let out = "";
        for(let sub in subSummary) {
            const daysLeft = Math.floor(subSummary[sub].totalQty / subSummary[sub].dailyRate);
            if(daysLeft < 180) out += `<div class="item-meta" style="color:var(--danger); margin-bottom:8px;">⚠️ <b>${sub}</b>：總剩餘 ${daysLeft} 天</div>`;
        }
        document.getElementById('plan-analysis').innerHTML = out || `<div class="item-meta" style="color:var(--safe)">✅ 180天內庫存充足</div>`;
    }

    function renderAll() {
        document.getElementById('ongoing-list').innerHTML = db.filter(i => i.status === '服用中').map(i => createItemElement(i)).join('');
        document.getElementById('full-inventory').innerHTML = db.filter(i => i.status === '庫存').map(i => createItemElement(i)).join('');
        document.getElementById('finished-list').innerHTML = db.filter(i => i.status === '已吃完').map(i => createItemElement(i)).join('');
        document.getElementById('lastUpdateText').innerText = "LAST RECORDED: " + (localStorage.getItem('vitaVault_lastUpdate') || "---");
        updateDispOptions();
        renderAnalysis();
    }

    function openEdit(id) {
        const i = db.find(x => x.id === id);
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('modalUI').innerHTML = `
            <div class="section-title">數據盤點</div>
            <div style="margin-bottom:15px; font-size:1rem;"><b>${i.name}</b> <span style="color:var(--primary)">${i.subCat}</span></div>
            <label>狀態</label><select id="upStatus"><option value="庫存" ${i.status==='庫存'?'selected':''}>庫存</option><option value="服用中" ${i.status==='服用中'?'selected':''}>服用中</option><option value="已吃完" ${i.status==='已吃完'?'selected':''}>已吃完</option></select>
            <div class="input-row">
                <div style="flex:1"><label>頻率</label><select id="upCycle"><option value="daily" ${i.cycle==='daily'?'selected':''}>每日</option><option value="weekly" ${i.cycle==='weekly'?'selected':''}>每週</option></select></div>
                <div style="flex:1"><label>回數</label><input type="number" id="upFreq" value="${i.freq}"></div>
                <div style="flex:1"><label>顆數</label><input type="text" id="upDose" value="${i.dose}"></div>
            </div>
            <label>目前餘量</label><input type="number" id="upQty" value="${i.totalQty}">
            <label>效期日期</label><input type="text" class="date-input" id="upExp" value="${i.expiry}">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
                <button class="btn btn-main" onclick="updateItem(${id})">儲存</button>
                <button class="btn btn-sub" onclick="closeModal()">取消</button>
            </div>
            <div style="text-align:center; margin-top:20px; font-size:0.7rem; color:var(--danger); text-decoration:underline;" onclick="deleteItem(${id})">刪除資料</div>`;
    }

    function updateItem(id) {
        const i = db.find(x => x.id === id);
        i.status = document.getElementById('upStatus').value;
        i.cycle = document.getElementById('upCycle').value;
        i.freq = parseInt(document.getElementById('upFreq').value) || 1;
        i.dose = document.getElementById('upDose').value;
        i.totalQty = parseInt(document.getElementById('upQty').value);
        i.expiry = document.getElementById('upExp').value;
        i.updatedAt = new Date().toLocaleString();
        save(); closeModal();
    }

    function deleteItem(id) { if(confirm("確定刪除？")) { db = db.filter(i => i.id !== id); save(); closeModal(); } }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function switchTab(t) {
        ['home', 'stock', 'plan', 'data'].forEach(x => document.getElementById('tab-'+x).style.display = x===t?'block':'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.onclick.toString().includes(t)));
        renderAll();
    }
    function exportAndCopy() {
        const box = document.getElementById('dataBox');
        box.value = JSON.stringify(db);
        box.select();
        navigator.clipboard.writeText(box.value).then(() => alert("數據已複製"));
    }
    function importData() {
        try {
            db = JSON.parse(document.getElementById('dataBox').value.trim());
            save(); alert("數據導入成功");
        } catch(e) { alert("導入失敗"); }
    }
    function cleanFinished() { if(confirm("確定要永久刪除歷史紀錄？")) { db = db.filter(i => i.status !== '已吃完'); save(); } }
    
    window.onload = renderAll;
</script>
</body>
</html>
