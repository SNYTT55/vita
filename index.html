<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="icon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Supplement</title>
    <style>
        :root {
            --primary: #CC7722; --bg: #F9F8F6; --card: #ffffff;
            --text-main: #424242; --text-label: #757575; --border-color: #E0E0E0;
            --danger: #BC4A3C; --safe: #6B8E23;
        }
        * { box-sizing: border-box; font-family: -apple-system, "Noto Sans TC", sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; -webkit-tap-highlight-color: transparent; }
        .header { background: #fff; padding: 20px; border-bottom: 1px solid #EEE; text-align: center; }
        .nav-tabs { display: flex; background: white; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #EEE; }
        .tab-btn { flex: 1; padding: 14px 5px; text-align: center; font-size: 0.8rem; color: #999; cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #EEE; box-shadow: 0 2px 8px rgba(0,0,0,0.02); }
        .section-title { font-size: 1rem; font-weight: bold; margin-bottom: 15px; color: var(--primary); border-left: 4px solid var(--primary); padding-left: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--text-label); font-weight: 500; }
        input, select, textarea { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--border-color); font-size: 0.9rem; background: #FDFDFD; color: var(--text-main); transition: border-color 0.2s; }
        input:focus { outline: none; border-color: var(--primary); background: #FFF; }
        .input-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .col-1 { flex: 1; }
        .col-3 { flex: 3; }
        .col-sub { flex: 4 !important; }
        .col-name { flex: 6 !important; }
        .col-full { flex: 10 !important; width: 100%; }
        .select-wrapper { position: relative; width: 100%; display: flex; align-items: center; }
        #subCatPicker, #upSubPicker { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; z-index: 2; }
        input[readonly] { background-color: #FDFDFD; cursor: pointer; }
        .btn { border-radius: 8px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-main { background: var(--primary); color: white; padding: 12px; width: 100%; margin-top: 5px; }
        .btn-sub { background: white; border: 1px solid var(--border-color); color: var(--text-label); padding: 8px; }
        .item-row { padding: 15px 0; border-bottom: 1px solid #F5F5F5; cursor: pointer; }
        .item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .item-name { font-size: 0.85rem; font-weight: 600; }
        .item-sub-label { font-size: 0.85rem; color: var(--primary); padding: 2px 8px; border-radius: 6px; margin-right: -8px; }        
        .item-meta-row { display: flex; justify-content: space-between; font-size: 0.75rem; color: #666; }
        #modalOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; justify-content:center; align-items:center; backdrop-filter: blur(5px); }
        .modal-content { background: #FFFFFF !important; padding: 25px 20px; border-radius: 20px; width: 90%; max-width: 400px; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
        .status-pill { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
        .s-服用中 { background: var(--primary); color: white; }
        .s-庫存 { background: #EEECE8; color: #777; }
        .s-已吃完 { background: #F0F0F0; color: #BBB; text-decoration: line-through; }
    </style>
</head>
<body>

<nav class="nav-tabs">
    <div class="tab-btn active" id="btn-home" onclick="switchTab('home')">今日管理</div>
    <div class="tab-btn" id="btn-stock" onclick="switchTab('stock')">庫存管理</div>
    <div class="tab-btn" id="btn-plan" onclick="switchTab('plan')">採買規劃</div>
    <div class="tab-btn" id="btn-data" onclick="switchTab('data')">數據管理</div>
</nav>

<div class="container">
    <div id="tab-home">
        <div class="card" style="border: 1.5px solid var(--primary); background: #FFFDFB;">
            <div class="section-title">智能導航開瓶</div>
            <div class="input-row">
                <div class="col-1"><label>模式</label>
                    <select id="dispMain" onchange="updateDispOptions()">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="補充品">補充品</option>
                    </select>
                </div>
                <div class="col-1"><label>分類</label><select id="dispSub" onchange="renderDispRec()"></select></div>
            </div>
            <div id="disp-result"></div>
        </div>
        <div class="card"><div class="section-title">目前服用中</div><div id="ongoing-list"></div></div>
    </div>

    <div id="tab-stock" style="display:none;">
        <div class="card">
            <div class="section-title">快速入庫備品</div>
            <div class="input-row">
                <div class="col-3"><label>模式</label>
                    <select id="mainCat">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="補充品">補充品</option>
                    </select>
                </div>
                <div class="col-1"><label>包數</label><input type="number" id="packCount" value="1"></div>
            </div>
            <div class="input-row">
                <div class="col-sub">
                    <label>分類</label>
                    <div class="select-wrapper">
                        <input type="text" id="subCat" placeholder="選取" readonly onclick="updateSubCatDatalist()">
                        <select id="subCatPicker" onchange="document.getElementById('subCat').value=this.value; if(this.value==='CUSTOM'){document.getElementById('subCat').value='';document.getElementById('subCat').readOnly=false;document.getElementById('subCat').focus();}">
                        </select>
                    </div>
                </div>
                <div class="col-name"><label>品名</label><input type="text" id="name" placeholder="名稱"></div>
            </div>
            <div class="input-row">
                <div class="col-1"><label>單包總數</label><input type="number" id="totalQty" value="60"></div>
                <div class="col-1"><label>每日回數</label><input type="number" id="baseFreq" value="1"></div>
                <div class="col-1"><label>每回顆數</label><input type="number" id="baseDose" value="1"></div>
            </div>
            <div class="input-row">
                <div class="col-1"><label>到期日期</label><input type="text" class="date-input" id="expiry" placeholder="YYYY/MM/DD"></div>
                <div class="col-1"><label>購買日期</label><input type="text" class="date-input" id="buyDate" placeholder="YYYY/MM/DD"></div>
            </div>
            <button class="btn btn-main" onclick="batchAdd()">批次登記入庫</button>
        </div>
        <div class="card"><div class="section-title">所有備品庫存</div><div id="full-inventory"></div></div>
    </div>
    
    <div id="tab-plan" style="display:none;">
        <div class="card">
            <div class="section-title">日期斷貨預估</div>
            <div class="input-row">
                <div class="col-3"><input type="text" class="date-input" id="checkDate" placeholder="YYYY/MM/DD"></div>
                <div class="col-1"><button class="btn btn-sub" style="width:100%" onclick="renderAnalysis(true)">分析</button></div>
            </div>
            <div id="deadline-result"></div>
        </div>
        <div class="card"><div class="section-title">90 天補貨雷達</div><div id="plan-analysis"></div></div>
    </div>

    <div id="tab-data" style="display:none;">
        <div class="card">
            <div class="section-title">數據備份 <span id="lastUpdateText" style="font-size:10px; color:#BBB;"></span></div>
            <textarea id="dataBox" rows="6" style="font-size:12px; font-family:monospace; margin-bottom:15px;"></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                <button class="btn btn-main" style="margin:0" onclick="exportAndCopy()">導出複製</button>
                <button class="btn btn-sub" onclick="importData()">導入數據</button>
            </div>
        </div>
        <div class="card">
            <div class="section-title">完食歷史紀錄</div>
            <div id="finished-list" style="max-height:300px; overflow-y:auto;"></div>
            <button class="btn" style="color:var(--danger); width:100%; font-size:0.8rem; margin-top:15px;" onclick="cleanFinished()">清空所有歷史紀錄</button>
        </div>
    </div>
</div>

<div id="modalOverlay"><div class="modal-content" id="modalUI"></div></div>

<script>
    let db = JSON.parse(localStorage.getItem('vitaVault_db') || '[]');

    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('date-input')) {
            let val = e.target.value.replace(/\D/g, '').substring(0, 8);
            if (val.length > 4 && val.length <= 6) val = val.substring(0, 4) + '/' + val.substring(4);
            else if (val.length > 6) val = val.substring(0, 4) + '/' + val.substring(4, 6) + '/' + val.substring(6);
            e.target.value = val;
        }
    });

    function save() {
        localStorage.setItem('vitaVault_db', JSON.stringify(db));
        localStorage.setItem('vitaVault_lastUpdate', new Date().toLocaleString());
        renderAll();
    }
    
    function updateSubCatDatalist() {
        let allSubs = [...new Set(db.map(i => i.subCat ? i.subCat.trim() : null))].filter(s => s && s !== '未分類');
        allSubs.sort(new Intl.Collator('zh-Hant-TW', { numeric: true, sensitivity: 'base' }).compare);
        const picker = document.getElementById('subCatPicker');
        if (picker) {
            picker.innerHTML = '<option value="">🔻選取</option>' + allSubs.map(s => `<option value="${s}">${s}</option>`).join('') + '<option value="CUSTOM">📝手動輸入</option>';
        }
    }

    function simulateInventory(itemList, targetDays = 2000) {
        if (!itemList.length) return { days: 0, gap: 0 };
        let activeItems = itemList.filter(i => i.mainCat !== '補充品' && i.isRoutine !== false);
        if (activeItems.length === 0) return { days: 9999, gap: 0 };

        let sorted = [...activeItems].sort((a,b) => new Date(a.expiry) - new Date(b.expiry));
        let tempItems = sorted.map(i => ({...i}));
        let currentDate = new Date(); currentDate.setHours(0,0,0,0);
        let daysPassed = 0, gapCount = 0;
        while (daysPassed < targetDays) {
            let activeItem = tempItems.find(i => i.totalQty > 0);
            let isConsuming = (activeItem && activeItem.mainCat === '生理期') ? (currentDate.getDate() >= 1 && currentDate.getDate() <= 7) : true;
            if (isConsuming) {
                const config = activeItem || activeItems[0];
                const rate = (parseFloat(config.freq) || 1) * (parseFloat(config.dose) || 1);
                if (activeItem) activeItem.totalQty -= rate; else gapCount += rate;
            }
            if (!activeItem && targetDays > 1000) return daysPassed;
            currentDate.setDate(currentDate.getDate() + 1); daysPassed++;
        }
        return { days: daysPassed, gap: gapCount };
    }

    function createItemElement(item) {
        if (item.status === '已吃完') {
            return `<div class="item-row" onclick="openEdit(${item.id})"><div class="item-header"><span class="status-pill s-已吃完">完食</span><span class="item-name">${item.name}</span></div><div class="item-meta-row" style="color:#BBB;">完食: ${item.updatedAt}</div></div>`;
        }
        let info = "";
        const expDate = new Date(item.expiry);
        const diff = Math.ceil((expDate - new Date()) / 86400000);
        const expColor = diff < 30 ? 'var(--danger)' : (diff < 90 ? '#E69B35' : '#666');
        if (item.mainCat === '補充品' || item.isRoutine === false) {
            info = `<b style="color:${expColor}">效期剩 ${diff} 天</b>`;
        } else {
            const sim = simulateInventory([item]);
            const days = (typeof sim === 'number') ? sim : sim.days;
            const finishDate = new Date(); finishDate.setDate(finishDate.getDate() + days);
            info = `預計<b style="color:var(--primary)">${finishDate.getMonth()+1}/${finishDate.getDate()}</b>吃完`;
        }
        return `<div class="item-row" onclick="openEdit(${item.id})"><div class="item-header"><span class="status-pill s-${item.status}">${item.status}</span><span class="item-sub-label">${item.subCat}</span><span class="item-name">${item.name}</span></div><div class="item-meta-row"><span>${item.totalQty}顆▪︎${info}</span><span>🗓️EXP:${item.expiry}</span></div></div>`;
    }

    function batchAdd() {
        const name = document.getElementById('name').value, count = parseInt(document.getElementById('packCount').value) || 1, exp = document.getElementById('expiry').value;
        if(!name || exp.length < 10) return alert("資訊不完整");
        const mode = document.getElementById('mainCat').value;
        for(let n=0; n<count; n++) {
            db.push({ id: Date.now() + n, mainCat: mode, subCat: document.getElementById('subCat').value || '未分類', name: name, totalQty: parseInt(document.getElementById('totalQty').value), buyDate: document.getElementById('buyDate').value, expiry: exp, freq: document.getElementById('baseFreq').value, dose: document.getElementById('baseDose').value, isRoutine: (mode !== '補充品'), status: '庫存', updatedAt: new Date().toLocaleString() });
        }
        save(); alert("入庫成功"); document.getElementById('name').value = '';
    }

    function openEdit(id) {
        const i = db.find(x => x.id === id);
        updateSubCatDatalist();
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('modalUI').innerHTML = `<div class="section-title">編輯數據項目</div><div class="input-row"><div class="col-sub"><label>模式</label><select id="upMain"><option value="基礎營養" ${i.mainCat==='基礎營養'?'selected':''}>基礎營養</option><option value="生理期" ${i.mainCat==='生理期'?'selected':''}>生理期</option><option value="補充品" ${i.mainCat==='補充品'?'selected':''}>補充品</option></select></div><div class="col-name"><label>分類</label><div class="select-wrapper"><input type="text" id="upSub" value="${i.subCat}" readonly><select id="upSubPicker" onchange="document.getElementById('upSub').value=this.value;">${document.getElementById('subCatPicker').innerHTML}</select></div></div></div><div class="input-row"><div class="col-full"><label>品名</label><input type="text" id="upName" value="${i.name}"></div></div><div class="input-row"><div class="col-1"><label>狀態</label><select id="upStatus"><option value="庫存" ${i.status==='庫存'?'selected':''}>庫存</option><option value="服用中" ${i.status==='服用中'?'selected':''}>服用中</option><option value="已吃完" ${i.status==='已吃完'?'selected':''}>已吃完</option></select></div><div class="col-1"><label>剩餘顆數</label><input type="number" id="upQty" value="${i.totalQty}"></div></div><div class="input-row"><div class="col-1"><label>到期日期</label><input type="text" class="date-input" id="upExp" value="${i.expiry}"></div><div class="col-1"><label>購買日期</label><input type="text" class="date-input" id="upBuy" value="${i.buyDate || ''}"></div></div><div class="input-row"><div class="col-1"><label>日回</label><input type="number" id="upFreq" value="${i.freq}"></div><div class="col-1"><label>回顆</label><input type="number" id="upDose" value="${i.dose}"></div></div><div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:20px;"><button class="btn btn-main" style="margin:0" onclick="updateItem(${id})">儲存</button><button class="btn btn-sub" onclick="closeModal()">取消</button></div><div style="text-align:center; color:red; margin-top:25px; font-size:12px;" onclick="deleteItem(${id})">⚠️ 刪除資料</div>`;
    }

    function updateItem(id) {
        const i = db.find(x => x.id === id);
        i.mainCat = document.getElementById('upMain').value; i.subCat = document.getElementById('upSub').value;
        i.name = document.getElementById('upName').value; i.status = document.getElementById('upStatus').value;
        i.totalQty = parseInt(document.getElementById('upQty').value); i.expiry = document.getElementById('upExp').value;
        i.buyDate = document.getElementById('upBuy').value; i.freq = document.getElementById('upFreq').value; i.dose = document.getElementById('upDose').value;
        i.isRoutine = (i.mainCat !== '補充品'); i.updatedAt = new Date().toLocaleString(); save(); closeModal();
    }

    function renderAll() {
        document.getElementById('ongoing-list').innerHTML = db.filter(i => i.status === '服用中').sort((a,b) => { let dA = simulateInventory([a]); let dB = simulateInventory([b]); return (typeof dA==='number'?dA:dA.days) - (typeof dB==='number'?dB:dB.days); }).map(i => createItemElement(i)).join('') || '<div style="text-align:center; padding:20px; color:#CCC;">無服用中項目</div>';
        document.getElementById('full-inventory').innerHTML = db.filter(i => i.status === '庫存').sort((a,b) => { const getRank = (item) => (item.mainCat === '補充品') ? 3 : (item.mainCat === '生理期' ? 2 : 1); if (getRank(a) !== getRank(b)) return getRank(a) - getRank(b); return new Date(a.expiry) - new Date(b.expiry); }).map(i => createItemElement(i)).join('') || '<div style="text-align:center; padding:20px; color:#CCC;">無庫存備品</div>';
        document.getElementById('finished-list').innerHTML = db.filter(i => i.status === '已吃完').sort((a,b) => new Date(b.updatedAt) - new Date(a.updatedAt)).map(i => createItemElement(i)).join('') || '<div style="text-align:center; padding:20px; color:#CCC;">無歷史紀錄</div>';
        document.getElementById('lastUpdateText').innerText = "最後同步：" + (localStorage.getItem('vitaVault_lastUpdate') || "---");
        updateDispOptions(); renderAnalysis(false); updateSubCatDatalist();
    }

    function updateDispOptions() {
        const mode = document.getElementById('dispMain').value;
        let subs = [...new Set(db.filter(i => i.mainCat === mode && i.status === '庫存').map(i => i.subCat))];
        subs.sort(new Intl.Collator('zh-Hant-TW', { numeric: true, sensitivity: 'base' }).compare);
        const el = document.getElementById('dispSub');
        if (el) el.innerHTML = subs.length ? subs.map(s => `<option value="${s}">${s}</option>`).join('') : '<option value="">無</option>';
        renderDispRec();
    }

    function renderDispRec() {
        const mode = document.getElementById('dispMain').value, sub = document.getElementById('dispSub').value, res = document.getElementById('disp-result');
        const item = db.filter(i => i.mainCat === mode && i.subCat === sub && i.status === '庫存').sort((a, b) => new Date(a.expiry) - new Date(b.expiry))[0];
        if(item) res.innerHTML = `<div style="margin-top:15px; border: 1.5px dashed var(--primary); padding:15px; border-radius:12px; background:#fff;">${createItemElement(item)}<button class="btn btn-main" onclick="quickOpen(${item.id})">確認開啟本瓶</button></div>`;
        else res.innerHTML = '<div style="text-align:center; padding:20px; color:#BBB; font-size:0.8rem;">目前無庫存</div>';
    }

    function renderAnalysis(isManual = false) {
        const targetDays = isManual ? Math.ceil((new Date(document.getElementById('checkDate').value) - new Date().setHours(0,0,0,0)) / 86400000) : 90;
        if (isNaN(targetDays)) return;
        const subGroup = {}; 
        db.filter(i => i.status !== '已吃完' && i.mainCat !== '補充品').forEach(i => { if(!subGroup[i.subCat]) subGroup[i.subCat] = []; subGroup[i.subCat].push(i); });
        let out = "";
        for(let sub in subGroup) {
            const res = simulateInventory(subGroup[sub], targetDays);
            if (res.gap > 0) out += `<div style="padding:12px 0; border-bottom:1px solid #EEE;"><div style="display:flex; justify-content:space-between;"><b>${sub}</b><span class="status-pill s-服用中">需補 ${Math.ceil(res.gap)} 顆</span></div><div style="font-size:11px; color:#999; margin-top:5px;">目前還能撐 ${simulateInventory(subGroup[sub])} 天</div></div>`;
        }
        document.getElementById(isManual ? 'deadline-result' : 'plan-analysis').innerHTML = out || `<div style="text-align:center; padding:20px; color:var(--safe)">✅ 庫存充足</div>`;
    }

    function quickOpen(id) { const i = db.find(x => x.id === id); i.status = '服用中'; i.updatedAt = new Date().toLocaleString(); save(); }
    function deleteItem(id) { if(confirm("確定永久刪除？")) { db = db.filter(x => x.id !== id); save(); closeModal(); } }
    function cleanFinished() { if(confirm("確定清空歷史？")) { db = db.filter(x => x.status !== '已吃完'); save(); } }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function switchTab(t) {
        ['home', 'stock', 'plan', 'data'].forEach(x => document.getElementById('tab-'+x).style.display = x===t?'block':'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-'+t).classList.add('active');
        renderAll();
    }
    function exportAndCopy() { const box = document.getElementById('dataBox'); box.value = JSON.stringify(db); box.select(); navigator.clipboard.writeText(box.value).then(() => alert("已複製")); }
    function importData() { try { db = JSON.parse(document.getElementById('dataBox').value); save(); alert("導入成功"); } catch(e) { alert("格式錯誤"); } }
    window.onload = renderAll;
</script>
</body>
</html>
