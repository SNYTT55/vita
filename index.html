<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VitaVault V5.3</title>
    <style>
        :root {
            --primary: #CC7722; --bg: #F9F8F6; --card: #ffffff;
            --text-main: #3C3C3C; --text-sub: #8C8C8C; --accent-soft: #EAE7E2;
            --danger: #BC4A3C; --safe: #6B8E23;
        }
        * { box-sizing: border-box; font-family: -apple-system, "Noto Sans TC", sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); margin: 0; padding-bottom: 80px; }
        .header { background: #fff; padding: 20px; border-bottom: 1px solid var(--accent-soft); text-align: center; }
        .header h1 { margin: 0; font-size: 1.1rem; letter-spacing: 3px; color: var(--primary); font-weight: 300; }
        .nav-tabs { display: flex; background: white; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--accent-soft); }
        .tab-btn { flex: 1; padding: 12px 5px; text-align: center; font-size: 0.75rem; color: var(--text-sub); cursor: pointer; }
        .tab-btn.active { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: bold; }
        .container { max-width: 600px; margin: auto; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 18px; margin-bottom: 15px; border: 1px solid var(--accent-soft); }
        .section-title { font-size: 0.8rem; font-weight: bold; margin-bottom: 12px; color: var(--primary); border-left: 3px solid var(--primary); padding-left: 8px; }
        
        /* 標籤前置排版 */
        .item-row { display: flex; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--accent-soft); cursor: pointer; }
        .item-info { flex: 1; min-width: 0; }
        .item-header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
        .item-name { font-size: 0.95rem; font-weight: bold; color: var(--text-main); }
        .item-sub-label { font-size: 0.7rem; color: var(--primary); background: #FFF5EB; padding: 1px 5px; border-radius: 4px; }
        .item-meta { font-size: 0.75rem; color: var(--text-sub); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .status-pill { font-size: 9px; padding: 2px 6px; border-radius: 4px; font-weight: bold; white-space: nowrap; }
        .s-服用中 { background: var(--primary); color: white; }
        .s-庫存 { background: var(--accent-soft); color: var(--text-sub); }
        .s-已吃完 { background: #eee; color: #aaa; text-decoration: line-through; }
        .finished-row { opacity: 0.6; }

        .input-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: flex-end; }
        label { display: block; font-size: 0.65rem; margin-bottom: 3px; color: var(--text-sub); font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--accent-soft); font-size: 14px; background: #fafafa; }
        .btn { border-radius: 8px; border: none; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        .btn-main { background: var(--primary); color: white; padding: 14px; width: 100%; }
        .btn-sub { background: white; border: 1px solid var(--accent-soft); color: var(--text-sub); padding: 10px; }
        
        #modalOverlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:2000; justify-content:center; align-items:center; }
        .modal-content { background:white; padding:25px; border-radius:12px; width:92%; max-width:450px; }
    </style>
</head>
<body>

<div class="header"><h1>VITAVAULT V5.3</h1></div>

<nav class="nav-tabs">
    <div class="tab-btn active" onclick="switchTab('home')">今日</div>
    <div class="tab-btn" onclick="switchTab('stock')">庫存</div>
    <div class="tab-btn" onclick="switchTab('plan')">採買</div>
    <div class="tab-btn" onclick="switchTab('data')">數據</div>
</nav>

<div class="container">
    <div id="tab-home">
        <div class="card" style="border: 1.5px solid var(--primary);">
            <div class="section-title">智能開啟導航</div>
            <div class="input-row">
                <div style="flex:1"><label>模式</label>
                    <select id="dispMain" onchange="updateDispOptions()">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="體態控制">體態控制</option>
                    </select>
                </div>
                <div style="flex:1"><label>分類</label><select id="dispSub" onchange="renderDispRec()"></select></div>
            </div>
            <div id="disp-result" style="margin-top:10px;"></div>
        </div>

        <div class="card">
            <div class="section-title">快速入庫</div>
            <div class="input-row">
                <div style="flex:7"><label>模式</label>
                    <select id="mainCat">
                        <option value="基礎營養">基礎營養</option>
                        <option value="生理期">生理期</option>
                        <option value="體態控制">體態控制</option>
                    </select>
                </div>
                <div style="flex:3"><label style="text-align:right">包數</label><input type="number" id="packCount" value="1" style="text-align:right"></div>
            </div>
            <div class="input-row">
                <div style="flex:4"><label>分類</label><input type="text" id="subCat" placeholder="如：眼睛"></div>
                <div style="flex:6"><label>品名</label><input type="text" id="name" placeholder="品項名稱"></div>
            </div>
            <div class="input-row">
                <div style="flex:1"><label>單包總數</label><input type="number" id="totalQty" value="60"></div>
                <div style="flex:1"><label>每次顆數</label><input type="number" id="baseDose" value="1"></div>
                <div style="flex:1"><label>每日次數</label><input type="number" id="baseFreq" value="1"></div>
            </div>
            <div class="input-row">
                <div style="flex:1"><label>到期日期</label><input type="text" class="date-input" id="expiry" placeholder="YYYY/MM/DD"></div>
                <div style="flex:1"><label>購買日期</label><input type="text" class="date-input" id="buyDate" placeholder="YYYY/MM/DD"></div>
            </div>
            <button class="btn btn-main" onclick="batchAdd()">REGISTER</button>
        </div>
        
        <div class="card">
            <div class="section-title">目前服用中</div>
            <div id="ongoing-list"></div>
        </div>
    </div>

    <div id="tab-stock" style="display:none;">
        <div class="card">
            <div class="section-title">庫存清單 (<span id="itemCount">0</span> 筆)</div>
            <div id="full-inventory" style="max-height:65vh; overflow-y:auto;"></div>
        </div>
    </div>

    <div id="tab-plan" style="display:none;">
        <div class="card">
            <div class="section-title">按「分類」查詢斷貨死線</div>
            <div class="input-row">
                <div style="flex:7"><input type="text" class="date-input" id="checkDate" placeholder="預定出國日期 YYYY/MM/DD"></div>
                <div style="flex:3"><button class="btn btn-sub" style="width:100%" onclick="renderAnalysis()">分析</button></div>
            </div>
            <div id="deadline-result" style="margin-top:10px;"></div>
        </div>
        <div class="card">
            <div class="section-title">180 天補貨雷達 (依功能分類)</div>
            <div id="plan-analysis"></div>
        </div>
    </div>

    <div id="tab-data" style="display:none;">
        <div class="card">
            <div class="section-title">數據備份</div>
            <textarea id="dataBox" rows="6" placeholder="JSON 數據" style="font-size:11px; margin-bottom:10px;"></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn btn-main" onclick="exportAndCopy()">導出</button>
                <button class="btn btn-sub" onclick="importData()">導入</button>
            </div>
        </div>
        <div class="card">
            <div class="section-title">完食歸檔</div>
            <div id="finished-list"></div>
            <button class="btn" style="color:var(--danger); width:100%; margin-top:10px; font-size:0.75rem;" onclick="cleanFinished()">清空歷史</button>
        </div>
    </div>
</div>

<div id="modalOverlay"><div class="modal-content" id="modalUI"></div></div>

<script>
    let db = JSON.parse(localStorage.getItem('vitaVault_db') || '[]');

    document.addEventListener('input', function(e) {
        if (e.target.classList.contains('date-input')) {
            let val = e.target.value.replace(/\D/g, '').substring(0, 8);
            if (val.length > 4 && val.length <= 6) val = val.substring(0, 4) + '/' + val.substring(4);
            else if (val.length > 6) val = val.substring(0, 4) + '/' + val.substring(4, 6) + '/' + val.substring(6);
            e.target.value = val;
        }
    });

    function save() {
        localStorage.setItem('vitaVault_db', JSON.stringify(db));
        renderAll();
    }

    // 統一排版組件：標籤前置、資訊同行
    function createItemElement(item) {
        const isFinished = item.status === '已吃完';
        const daily = item.mainCat === '生理期' ? (item.dose * item.freq * 7 / 30) : (item.dose * item.freq);
        const daysLeft = Math.round(item.totalQty / (daily || 1));
        
        if (isFinished) {
            return `
                <div class="item-row finished-row" onclick="openEdit(${item.id})">
                    <div class="item-info">
                        <div class="item-header">
                            <span class="status-pill s-已吃完">已吃完</span>
                            <span class="item-name">${item.name}</span>
                        </div>
                        <span class="item-meta">完食日期: ${item.updatedAt.split(' ')[0]}</span>
                    </div>
                </div>`;
        }

        return `
            <div class="item-row" onclick="openEdit(${item.id})">
                <div class="item-info">
                    <div class="item-header">
                        <span class="status-pill s-${item.status}">${item.status}</span>
                        <span class="item-name">${item.name}</span>
                        <span class="item-sub-label">${item.subCat}</span>
                    </div>
                    <span class="item-meta">餘 ${item.totalQty} 顆 (約 ${daysLeft} 天) · 效期: ${item.expiry}</span>
                </div>
            </div>`;
    }

    function batchAdd() {
        const name = document.getElementById('name').value;
        const exp = document.getElementById('expiry').value;
        if(!name || exp.length < 10) return alert("資料不完整");
        const count = parseInt(document.getElementById('packCount').value) || 1;
        for(let i=0; i<count; i++) {
            db.push({
                id: Date.now() + i, mainCat: document.getElementById('mainCat').value,
                subCat: document.getElementById('subCat').value || '未分類', name: name,
                totalQty: parseInt(document.getElementById('totalQty').value),
                dose: parseInt(document.getElementById('baseDose').value),
                freq: parseInt(document.getElementById('baseFreq').value),
                expiry: exp, status: '庫存', updatedAt: new Date().toLocaleString()
            });
        }
        save(); alert("入庫成功"); document.getElementById('name').value = '';
    }

    function updateDispOptions() {
        const mode = document.getElementById('dispMain').value;
        const subs = [...new Set(db.filter(i => i.mainCat === mode && i.status === '庫存').map(i => i.subCat))];
        const el = document.getElementById('dispSub');
        el.innerHTML = subs.length ? subs.map(s => `<option value="${s}">${s}</option>`).join('') : '<option value="">無</option>';
        renderDispRec();
    }

    function renderDispRec() {
        const mode = document.getElementById('dispMain').value;
        const sub = document.getElementById('dispSub').value;
        const res = document.getElementById('disp-result');
        const item = db.filter(i => i.mainCat === mode && i.subCat === sub && i.status === '庫存').sort((a,b) => new Date(a.expiry) - new Date(b.expiry))[0];
        res.innerHTML = item ? `<div style="border: 1px dashed var(--primary); padding:10px; border-radius:8px; background:#fff;">${createItemElement(item)}</div>` : '<div class="item-meta">目前無庫存</div>';
    }

    // --- 補貨雷達：改為按「分類」加總判斷 ---
    function renderAnalysis() {
        const checkVal = document.getElementById('checkDate').value;
        const targetDays = checkVal.length === 10 ? Math.ceil((new Date(checkVal) - new Date()) / 86400000) : 180;
        
        const subSummary = {}; // 按分類統計
        db.filter(i => i.status !== '已吃完').forEach(i => {
            const daily = i.mainCat === '生理期' ? (i.dose * i.freq * 7 / 30) : (i.dose * i.freq);
            if(!subSummary[i.subCat]) subSummary[i.subCat] = { totalQty: 0, daily: daily || 1 };
            subSummary[i.subCat].totalQty += i.totalQty;
        });

        let out = "";
        for(let sub in subSummary) {
            const daysLeft = Math.floor(subSummary[sub].totalQty / subSummary[sub].daily);
            if(daysLeft < targetDays) {
                out += `<div class="item-meta" style="color:var(--danger); margin-bottom:8px;">⚠️ <b>${sub}</b>：總剩餘 ${daysLeft} 天 (缺 ${targetDays - daysLeft} 天)</div>`;
            }
        }
        
        const target = checkVal.length === 10 ? 'deadline-result' : 'plan-analysis';
        document.getElementById(target).innerHTML = out || `<div class="item-meta" style="color:var(--safe)">✅ 所有功能分類在 ${targetDays} 天內皆充足</div>`;
    }

    function renderAll() {
        document.getElementById('ongoing-list').innerHTML = db.filter(i => i.status === '服用中').map(i => createItemElement(i)).join('');
        const inv = db.filter(i => i.status !== '已吃完').sort((a,b) => new Date(a.expiry) - new Date(b.expiry));
        document.getElementById('full-inventory').innerHTML = inv.map(i => createItemElement(i)).join('');
        document.getElementById('itemCount').innerText = inv.length;
        document.getElementById('finished-list').innerHTML = db.filter(i => i.status === '已吃完').map(i => createItemElement(i)).join('');
        updateDispOptions();
        renderAnalysis();
    }

    function openEdit(id) {
        const i = db.find(x => x.id === id);
        document.getElementById('modalOverlay').style.display = 'flex';
        document.getElementById('modalUI').innerHTML = `
            <div class="section-title">盤點紀錄</div>
            <div style="margin-bottom:15px; font-size:1rem;"><b>${i.name}</b></div>
            <label>目前狀態</label>
            <select id="upStatus">
                <option value="庫存" ${i.status==='庫存'?'selected':''}>庫存 (待開)</option>
                <option value="服用中" ${i.status==='服用中'?'selected':''}>服用中 (正在吃)</option>
                <option value="已吃完" ${i.status==='已吃完'?'selected':''}>已吃完 (完食)</option>
            </select>
            <label>數量盤點</label><input type="number" id="upQty" value="${i.totalQty}">
            <label>效期</label><input type="text" class="date-input" id="upExp" value="${i.expiry}">
            <div class="modal-actions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:15px;">
                <button class="btn btn-main" onclick="updateItem(${id})">儲存</button>
                <button class="btn btn-sub" onclick="closeModal()">取消</button>
            </div>
            <div style="text-align:center; margin-top:20px; font-size:0.7rem; color:var(--danger); text-decoration:underline;" onclick="deleteItem(${id})">刪除此筆資料</div>`;
    }

    function updateItem(id) {
        const i = db.find(x => x.id === id);
        i.status = document.getElementById('upStatus').value;
        i.totalQty = parseInt(document.getElementById('upQty').value);
        i.expiry = document.getElementById('upExp').value;
        i.updatedAt = new Date().toLocaleString();
        save(); closeModal();
    }

    function deleteItem(id) { if(confirm("確定刪除？")) { db = db.filter(i => i.id !== id); save(); closeModal(); } }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    function switchTab(t) {
        ['home', 'stock', 'plan', 'data'].forEach(x => document.getElementById('tab-'+x).style.display = x===t?'block':'none');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.onclick.toString().includes(t)));
        renderAll();
    }
    function exportAndCopy() {
        const box = document.getElementById('dataBox');
        box.value = JSON.stringify(db);
        box.select();
        navigator.clipboard.writeText(box.value).then(() => alert("數據已複製"));
    }
    function importData() {
        try {
            db = JSON.parse(document.getElementById('dataBox').value.trim());
            save(); alert("導入成功");
        } catch(e) { alert("導入失敗"); }
    }
    function cleanFinished() { if(confirm("清空歷史？")) { db = db.filter(i => i.status !== '已吃完'); save(); } }
    
    window.onload = renderAll;
</script>
</body>
</html>
